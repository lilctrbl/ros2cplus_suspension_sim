# 悬架模型参数（供 model_node / test_model 加载）
# 参数既可写在 model: 段下，也可直接写在顶层。

model:
  type: quarter_car_2dof   # 模型类型（工厂据此构造具体模型）
  ms: 300.0                # 簧上质量 (kg)
  mus: 40.0                # 簧下质量 (kg)
  ks: 15000.0              # 悬架刚度 (N/m)
  cs: 1000.0               # 悬架阻尼 (N·s/m)
  kt: 200000.0             # 轮胎刚度 (N/m)
  rate: 100.0              # 模型更新频率 (Hz)
